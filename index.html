<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>職安衛工作許可證查核儀表板</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主選單">
      <div class="brand">
        <div class="brand-mark">安</div>
        <div>
          <p class="eyebrow">CPC OSH Dashboard</p>
          <h1>工作許可證查核儀表板</h1>
        </div>
      </div>
      <nav>
        <a class="active" href="#overview">總覽</a>
        <a href="#risk">風險排行</a>
        <a href="#modules">核心模組</a>
        <a href="#details">細部查核</a>
      </nav>
      <div class="status-panel">
        <span class="status-dot"></span>
        <div>
          <strong>模擬資料</strong>
          <p>5個廠區、3年逐月資料、10項共同核心查核模組。</p>
        </div>
      </div>
    </aside>

    <main>
      <section class="topbar">
        <div>
          <p class="eyebrow">桃園、台中、嘉義、高雄大林、高雄林園</p>
          <h2>工作許可證共同核心查核結果</h2>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="resetFilters" title="重設篩選" aria-label="重設篩選">↺</button>
          <button class="primary-button" id="exportSummary">匯出摘要</button>
        </div>
      </section>

      <section class="filters" aria-label="篩選條件">
        <label>
          起始月份
          <input id="startMonthFilter" type="month" value="2024-01" min="2024-01" max="2026-12">
        </label>
        <label>
          結束月份
          <input id="endMonthFilter" type="month" value="2026-12" min="2024-01" max="2026-12">
        </label>
        <label>
          廠區
          <select id="plantFilter">
            <option value="all">全部廠區</option>
          </select>
        </label>
        <label>
          核心模組
          <select id="moduleFilter">
            <option value="all">全部模組</option>
          </select>
        </label>
        <label>
          風險等級
          <select id="riskFilter">
            <option value="all">全部等級</option>
            <option value="高">高</option>
            <option value="中">中</option>
            <option value="低">低</option>
          </select>
        </label>
      </section>

      <section class="summary-grid" id="overview" aria-label="關鍵指標">
        <button class="metric-card active" data-metric="permits">
          <span>工作許可證</span>
          <strong id="metricPermits">0</strong>
          <small>核准與執行件數</small>
        </button>
        <button class="metric-card" data-metric="checks">
          <span>查核項次</span>
          <strong id="metricChecks">0</strong>
          <small>核心模組查核總量</small>
        </button>
        <button class="metric-card" data-metric="passRate">
          <span>整體合格率</span>
          <strong id="metricPassRate">0%</strong>
          <small>通過項次 / 查核項次</small>
        </button>
        <button class="metric-card danger" data-metric="critical">
          <span>重大缺失</span>
          <strong id="metricCritical">0</strong>
          <small>立即矯正或停工等級</small>
        </button>
        <button class="metric-card" data-metric="open">
          <span>未結案缺失</span>
          <strong id="metricOpen">0</strong>
          <small>待改善或逾期追蹤</small>
        </button>
        <button class="metric-card" data-metric="gas">
          <span>氣體偵測異常</span>
          <strong id="metricGas">0</strong>
          <small>LEL、氧氣或有害氣體</small>
        </button>
        <button class="metric-card" data-metric="hotWork">
          <span>動火高風險缺失</span>
          <strong id="metricHotWork">0</strong>
          <small>看火、防火、電焊與氣瓶</small>
        </button>
        <button class="metric-card" data-metric="highWork">
          <span>高處防墜缺失</span>
          <strong id="metricHighWork">0</strong>
          <small>施工架、安全帶、安全母索</small>
        </button>
      </section>

      <section class="content-grid">
        <article class="panel large">
          <div class="panel-header">
            <div>
              <p class="eyebrow" id="trendSubtitle">工作許可證</p>
              <h3>3年逐月趨勢</h3>
            </div>
          </div>
          <canvas id="trendCanvas" width="900" height="320" aria-label="月趨勢圖"></canvas>
        </article>

        <article class="panel" id="risk">
          <div class="panel-header">
            <div>
              <p class="eyebrow">管理優先順序</p>
              <h3>廠區風險排行</h3>
            </div>
          </div>
          <div class="plant-risk-list" id="plantRiskList"></div>
        </article>

        <article class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">矯正追蹤</p>
              <h3>缺失狀態</h3>
            </div>
          </div>
          <div class="status-bars" id="statusBars"></div>
        </article>
      </section>

      <section class="panel" id="modules">
        <div class="panel-header">
          <div>
            <p class="eyebrow">共同核心查核模組</p>
            <h3>模組合格率與重大缺失</h3>
          </div>
        </div>
        <div class="module-grid" id="moduleGrid"></div>
      </section>

      <section class="panel" id="details">
        <div class="panel-header">
          <div>
            <p class="eyebrow">可下鑽細項</p>
            <h3>查核項目明細</h3>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>月份</th>
                <th>廠區</th>
                <th>模組</th>
                <th>查核項目</th>
                <th>查核數</th>
                <th>缺失數</th>
                <th>重大</th>
                <th>未結案</th>
                <th>合格率</th>
                <th>風險</th>
              </tr>
            </thead>
            <tbody id="detailRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
